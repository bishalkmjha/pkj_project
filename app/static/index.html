<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkPulse</title>
<style>
  :root { --bg:#f7f7f8; --card:#fff; --ink:#18181b; --muted:#71717a; --line:#e4e4e7; --accent:#4f46e5; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f0f12; --card:#18181c; --ink:#f4f4f5; --muted:#a1a1aa; --line:#2a2a30; --accent:#818cf8; --bad:#f87171; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:960px; margin:0 auto; padding:24px 16px 64px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
  h1 { font-size:22px; margin:0; } h2 { font-size:17px; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); }
  .plan.current { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .price { font-size:24px; font-weight:600; } .muted { color:var(--muted); font-size:13px; }
  input, button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); border-color:var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  form.row, .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  form.row input { flex:1; min-width:160px; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:8px 0; }
  .bar > div { height:100%; background:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { text-align:left; padding:8px 4px; border-bottom:1px solid var(--line); word-break:break-all; }
  .err { color:var(--bad); min-height:1.5em; } .badge { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); }
  ul { margin:8px 0; padding-left:18px; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <header><h1>LinkPulse</h1><button id="logout" class="ghost hidden">Log out</button></header>

  <section id="auth" class="card">
    <h2>Sign in or create an account</h2>
    <form id="authForm" class="row">
      <input id="email" type="email" placeholder="you@example.com" required>
      <input id="password" type="password" placeholder="password (8+ chars)" minlength="8" required>
      <button data-mode="login">Log in</button>
      <button data-mode="signup" class="ghost">Sign up</button>
    </form>
    <p class="err" id="authErr"></p>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">Your subscription</h2>
        <span class="badge" id="status"></span>
      </div>
      <p id="subLine" class="muted"></p>
      <div id="usageLine"></div>
      <div class="bar"><div id="usageBar" style="width:0"></div></div>
      <div class="row" id="subActions"></div>
      <p class="err" id="subErr"></p>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">Plans</h2>
        <label class="muted"><input type="checkbox" id="yearly"> Bill yearly (2 months free)</label>
      </div>
      <div class="grid" id="plans" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <h2>Links</h2>
      <form id="linkForm" class="row">
        <input id="url" type="url" placeholder="https://example.com/very/long/url" required>
        <input id="slug" placeholder="custom-slug (Business)" style="max-width:200px">
        <button>Shorten</button>
      </form>
      <p class="err" id="linkErr"></p>
      <table><thead><tr><th>Short link</th><th>Target</th><th></th></tr></thead><tbody id="links"></tbody></table>
      <pre id="stats" class="muted"></pre>
    </div>

    <div class="card">
      <h2>Invoices</h2>
      <table><thead><tr><th>Date</th><th>Plan</th><th>Amount</th><th>Status</th></tr></thead><tbody id="invoices"></tbody></table>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const store = { get() { try { return localStorage.getItem("lp_token"); } catch { return null; } },
                set(v) { try { v ? localStorage.setItem("lp_token", v) : localStorage.removeItem("lp_token"); } catch {} } };
let token = store.get();
const money = (c) => "$" + (c / 100).toFixed(2);

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (token) headers.Authorization = "Bearer " + token;
  if (opts.json) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.json); }
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401 && token) { logout(); throw new Error("Session expired"); }
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : (data.detail?.[0]?.msg || res.statusText));
  return data;
}

function logout() { token = null; store.set(null); render(); }
$("logout").onclick = logout;

$("authForm").onsubmit = (e) => e.preventDefault();
document.querySelectorAll("#authForm button").forEach((b) => b.onclick = async (e) => {
  e.preventDefault(); $("authErr").textContent = "";
  const email = $("email").value, password = $("password").value;
  try {
    let data;
    if (b.dataset.mode === "signup") data = await api("/auth/signup", { method: "POST", json: { email, password } });
    else data = await api("/auth/token", { method: "POST", body: new URLSearchParams({ username: email, password }) });
    token = data.access_token; store.set(token); render();
  } catch (err) { $("authErr").textContent = err.message; }
});

async function subAction(fn) {
  $("subErr").textContent = "";
  try { await fn(); await render(); } catch (err) { $("subErr").textContent = err.message; }
}

async function render() {
  const authed = !!token;
  $("auth").classList.toggle("hidden", authed);
  $("app").classList.toggle("hidden", !authed);
  $("logout").classList.toggle("hidden", !authed);
  if (!authed) return;

  const [me, plans, links, invoices] = await Promise.all([api("/me"), api("/plans"), api("/links"), api("/invoices")]);
  const s = me.subscription, u = me.usage;
  $("status").textContent = s.status;
  const end = s.current_period_end ? new Date(s.current_period_end + "Z").toLocaleDateString() : null;
  let line = `${me.email} · ${s.plan} plan`;
  if (s.effective_plan !== s.plan) line += ` (currently limited to ${s.effective_plan})`;
  if (end) line += s.cancel_at_period_end ? ` · ends ${end}` : (s.status === "trialing" ? ` · trial ends ${end}` : ` · renews ${end}`);
  if (s.pending_plan) line += ` · switching to ${s.pending_plan} at renewal`;
  $("subLine").textContent = line;
  $("usageLine").textContent = `${u.links_used} / ${u.link_limit ?? "∞"} links used`;
  $("usageBar").style.width = u.link_limit ? Math.min(100, 100 * u.links_used / u.link_limit) + "%" : "4%";

  const actions = $("subActions"); actions.innerHTML = "";
  const btn = (label, fn, ghost = true) => { const b = document.createElement("button"); b.textContent = label; if (ghost) b.className = "ghost"; b.onclick = () => subAction(fn); actions.append(b); };
  if (s.plan !== "free" && !s.cancel_at_period_end && s.status !== "past_due") btn("Cancel", () => api("/subscription/cancel", { method: "POST" }));
  if (s.cancel_at_period_end) btn("Resume", () => api("/subscription/resume", { method: "POST" }), false);
  if (s.plan !== "free") {
    btn("Simulate renewal", () => api("/billing/fake/simulate/invoice.paid", { method: "POST" }));
    btn("Simulate failed payment", () => api("/billing/fake/simulate/invoice.payment_failed", { method: "POST" }));
  }

  const yearly = $("yearly").checked;
  const paidActive = s.plan !== "free" && ["active", "trialing"].includes(s.status);
  $("plans").innerHTML = "";
  for (const p of plans) {
    const el = document.createElement("div");
    el.className = "card plan" + (p.code === s.plan ? " current" : "");
    el.style.margin = 0;
    const price = yearly ? p.yearly_price_cents : p.monthly_price_cents;
    el.innerHTML = `<strong>${p.name}</strong>
      <div class="price">${money(price)}<span class="muted"> / ${yearly ? "year" : "month"}</span></div>
      <ul><li>${p.link_limit ?? "Unlimited"} links</li>${p.features.map((f) => `<li>${f.replace("_", " ")}</li>`).join("")}
      ${p.trial_days ? `<li>${p.trial_days}-day free trial</li>` : ""}</ul>`;
    const b = document.createElement("button");
    if (p.code === s.plan && !s.pending_plan && !s.cancel_at_period_end && s.status !== "past_due") { b.textContent = "Current plan"; b.disabled = true; }
    else if (paidActive) { b.textContent = p.code === s.plan ? "Keep this plan" : "Switch"; b.onclick = () => subAction(() => api("/subscription/change", { method: "POST", json: { plan: p.code } })); }
    else if (p.code === "free") { b.textContent = "Current plan"; b.disabled = s.plan === "free"; b.className = "ghost"; }
    else { b.textContent = "Subscribe"; b.onclick = () => subAction(async () => {
      const c = await api("/subscription/checkout", { method: "POST", json: { plan: p.code, interval: yearly ? "year" : "month" } });
      location.href = c.checkout_url; }); }
    el.append(b); $("plans").append(el);
  }

  $("links").innerHTML = "";
  for (const l of links) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><a href="${l.short_url}" target="_blank" rel="noopener">${l.short_url}</a></td><td></td><td class="row"></td>`;
    tr.children[1].textContent = l.target_url;
    const st = document.createElement("button"); st.className = "ghost"; st.textContent = "Stats";
    st.onclick = async () => { try { $("stats").textContent = JSON.stringify(await api(`/links/${l.id}/stats`), null, 2); } catch (e) { $("stats").textContent = e.message; } };
    const del = document.createElement("button"); del.className = "ghost"; del.textContent = "Delete";
    del.onclick = async () => { await api(`/links/${l.id}`, { method: "DELETE" }); render(); };
    tr.children[2].append(st, del); $("links").append(tr);
  }

  $("invoices").innerHTML = invoices.length ? "" : `<tr><td colspan="4" class="muted">No invoices yet</td></tr>`;
  for (const i of invoices) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${new Date(i.created_at + "Z").toLocaleDateString()}</td><td>${i.plan_code}</td><td>${money(i.amount_cents)}</td><td>${i.status}</td>`;
    $("invoices").append(tr);
  }
}

$("yearly").onchange = render;
$("linkForm").onsubmit = async (e) => {
  e.preventDefault(); $("linkErr").textContent = "";
  try {
    const json = { url: $("url").value }; if ($("slug").value) json.slug = $("slug").value;
    await api("/links", { method: "POST", json }); $("url").value = ""; $("slug").value = ""; render();
  } catch (err) { $("linkErr").textContent = err.message; }
};
render().catch((e) => { $("authErr").textContent = e.message; });
</script>
</body>
</html>
